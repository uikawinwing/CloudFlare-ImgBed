name: Retire legacy Cloudflare Pages

on:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/retire-legacy-pages.yml

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Delete legacy Pages deployments and project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          project="cloudflare-imgbed"
          prod_id=""

          while :; do
            ids=$(npx wrangler pages deployment list --project-name "$project" --json | jq -r '.[].Id')
            to_delete=$(printf '%s\n' "$ids" | grep -v -F -x "$prod_id" | grep . || true)
            if [ -z "$to_delete" ]; then
              echo "Deployment cleanup complete. Production deployment: ${prod_id:-none}"
              break
            fi

            echo "Deleting $(printf '%s\n' "$to_delete" | wc -l | tr -d ' ') Pages deployments..."
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              if ! npx wrangler pages deployment delete "$id" --project-name "$project" --force 2>&1 | tee /tmp/wrangler-del.log | grep -q "Successfully deleted"; then
                if grep -q "active production deployment" /tmp/wrangler-del.log; then
                  prod_id="$id"
                  echo "Keeping active production deployment $prod_id until project deletion."
                else
                  cat /tmp/wrangler-del.log
                  exit 1
                fi
              fi
            done <<< "$to_delete"
          done

          npx wrangler pages project delete "$project" --yes
