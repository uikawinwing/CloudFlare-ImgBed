name: Deploy staging to Cloudflare Workers

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-workers-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      staging_url: ${{ steps.staging_url.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Worker dependencies
        run: npm ci

      - name: Check staging deployment configuration
        env:
          STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID || secrets.STAGING_D1_DATABASE_ID }}
          STAGING_DISCORD_CLIENT_ID: ${{ vars.STAGING_DISCORD_CLIENT_ID }}
          STAGING_DISCORD_CALLBACK_URL: ${{ vars.STAGING_DISCORD_CALLBACK_URL }}
          STAGING_DISCORD_CLIENT_SECRET: ${{ secrets.STAGING_DISCORD_CLIENT_SECRET }}
        run: |
          if [ -z "$STAGING_D1_DATABASE_ID" ]; then
            echo "STAGING_D1_DATABASE_ID is required and must refer to the separate staging D1 database."
            exit 1
          fi
          if [ -z "$STAGING_DISCORD_CLIENT_SECRET" ]; then
            echo "STAGING_DISCORD_CLIENT_SECRET is required so Discord OAuth remains functional after migration."
            exit 1
          fi
          if [ -z "$STAGING_DISCORD_CLIENT_ID" ]; then
            echo "STAGING_DISCORD_CLIENT_ID is required so Discord OAuth remains enabled."
            exit 1
          fi
          if [ -z "$STAGING_DISCORD_CALLBACK_URL" ]; then
            echo "STAGING_DISCORD_CALLBACK_URL is required and must point to the staging Worker."
            exit 1
          fi

      - name: Generate Worker routes
        run: node deploy/worker/generate-routes.js

      - name: Generate staging Wrangler configuration
        env:
          STAGING_D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID || secrets.STAGING_D1_DATABASE_ID }}
          STAGING_D1_DATABASE_NAME: ${{ vars.STAGING_D1_DATABASE_NAME || secrets.STAGING_D1_DATABASE_NAME }}
          STAGING_KV_NAMESPACE_ID: ${{ vars.STAGING_KV_NAMESPACE_ID || secrets.STAGING_KV_NAMESPACE_ID }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME || secrets.STAGING_R2_BUCKET_NAME }}
          STAGING_WORKER_NAME: ${{ vars.STAGING_WORKER_NAME || secrets.STAGING_WORKER_NAME }}
          STAGING_WORKER_VARS: ${{ secrets.STAGING_WORKER_VARS }}
          STAGING_WORKER_CUSTOM_DOMAIN: ${{ vars.STAGING_WORKER_CUSTOM_DOMAIN || secrets.STAGING_WORKER_CUSTOM_DOMAIN }}
          STAGING_DISCORD_CLIENT_ID: ${{ vars.STAGING_DISCORD_CLIENT_ID }}
          STAGING_DISCORD_CALLBACK_URL: ${{ vars.STAGING_DISCORD_CALLBACK_URL }}
        run: node deploy/worker/generate-staging-toml.js

      - name: Validate and deploy staging Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: |
            deploy --dry-run --config deploy/worker/wrangler.staging.toml
            deploy --config deploy/worker/wrangler.staging.toml
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync staging Discord OAuth secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.STAGING_DISCORD_CLIENT_SECRET }}
        run: |
          printf '%s' "$DISCORD_CLIENT_SECRET" | npx wrangler secret put DISCORD_CLIENT_SECRET --config deploy/worker/wrangler.staging.toml

      - name: Publish staging URL
        id: staging_url
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          STAGING_WORKER_CUSTOM_DOMAIN: ${{ vars.STAGING_WORKER_CUSTOM_DOMAIN || secrets.STAGING_WORKER_CUSTOM_DOMAIN }}
        run: |
          if [ -n "$STAGING_WORKER_CUSTOM_DOMAIN" ]; then
            STAGING_URL="https://$STAGING_WORKER_CUSTOM_DOMAIN"
          elif [ -n "$DEPLOYMENT_URL" ]; then
            STAGING_URL="$DEPLOYMENT_URL"
          else
            echo "Wrangler did not report the staging Worker URL."
            exit 1
          fi

          echo "url=$STAGING_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Staging Worker"
            echo
            echo "URL: $STAGING_URL"
          } >> "$GITHUB_STEP_SUMMARY"
