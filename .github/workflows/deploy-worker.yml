name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      worker_name:
        description: "Worker Name"
        required: false
        default: ""

# 在仓库 Settings → Secrets and variables → Actions 中配置。
# Cloudflare 凭证使用 Secrets；资源 ID 和名称使用 Variables。
#
# 必填：
#   CLOUDFLARE_API_TOKEN  - Cloudflare API Token（需要 Workers 编辑权限）
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare Account ID
#
# 必填资源：
#   D1_DATABASE_ID        - D1 数据库 ID
#   D1_DATABASE_NAME      - D1 数据库名称
#   KV_NAMESPACE_ID       - KV 命名空间 ID
#   R2_BUCKET_NAME        - R2 存储桶名称
#   WORKER_NAME           - Worker 名称
#
# 可选 Secret：
#   WORKER_VARS           - JSON 格式的业务环境变量（非必要不建议配置，
#                           部署完成后请在管理面板中配置所有设置）

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check production deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || secrets.D1_DATABASE_NAME }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID || secrets.KV_NAMESPACE_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || secrets.R2_BUCKET_NAME }}
          WORKER_NAME: ${{ inputs.worker_name || vars.WORKER_NAME || secrets.WORKER_NAME }}
        run: |
          missing=0
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            D1_DATABASE_ID \
            D1_DATABASE_NAME \
            KV_NAMESPACE_ID \
            R2_BUCKET_NAME \
            WORKER_NAME
          do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for the production Worker deployment."
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Generate worker routes
        run: node deploy/worker/generate-routes.js

      - name: Generate wrangler config
        env:
          WORKER_NAME: ${{ inputs.worker_name || vars.WORKER_NAME || secrets.WORKER_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || secrets.D1_DATABASE_NAME }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID || secrets.KV_NAMESPACE_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || secrets.R2_BUCKET_NAME }}
          WORKER_VARS: ${{ secrets.WORKER_VARS }}
        run: node deploy/worker/generate-toml.js

      - name: Validate production Worker bundle
        run: npx wrangler deploy --dry-run --config deploy/worker/wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config deploy/worker/wrangler.toml
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
