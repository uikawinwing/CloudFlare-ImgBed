name = "cloudflare-imgbed-local"
main = "index.js"
compatibility_date = "2026-08-25"
compatibility_flags = ["global_fetch_strictly_public"]

[assets]
directory = "../../frontend-dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/dav", "/dav/*", "/file", "/file/*", "/gallery", "/gallery/*", "/my-albums", "/my-files", "/random", "/random/*", "/thumb", "/thumb/*", "/upload", "/upload/*"]

[[d1_databases]]
binding = "img_d1"
database_name = "imgbed_local_d1"
database_id = "00000000-0000-0000-0000-000000000000"
remote = false

[[r2_buckets]]
binding = "img_r2"
bucket_name = "imgbed-local-r2"
remote = false

[[r2_buckets]]
binding = "THUMBNAILS"
bucket_name = "imgbed-local-thumbnails"
remote = false

[[kv_namespaces]]
binding = "img_url"
id = "00000000000000000000000000000000"
remote = false
