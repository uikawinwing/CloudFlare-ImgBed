<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3efe7">
  <meta name="description" content="发现由创作者公开分享的图片、动图与视频。">
  <link rel="icon" href="/static/media/logo.png">
  <link rel="stylesheet" href="/discover/discover.css">
  <title>发现 · CloudFlare ImgBed</title>
</head>
<body>
  <a class="skip-link" href="#explore">跳到作品列表</a>
  <header class="public-nav">
    <a class="brand" href="/" aria-label="CloudFlare ImgBed 发现页"><span class="brand-mark" aria-hidden="true">I</span><span>ImgBed <small>Community</small></span></a>
    <nav class="public-links" aria-label="公共导航"><a class="is-active" href="#explore">发现</a><a href="#featured">精选</a><a href="#explore">最新</a></nav>
    <div class="nav-actions"><a class="text-button" data-account-action href="/api/auth/discord?returnTo=/">登录</a><a class="primary-button" data-upload-action href="/api/auth/discord?returnTo=/studio">上传</a></div>
  </header>
  <main class="discover-wrap">
    <section class="hero" aria-labelledby="discoverTitle">
      <div class="hero-copy"><h1 id="discoverTitle">发现值得<br>停下来的图。</h1><p>创作者把愿意公开的图片、动图与视频整理成作品。其他图床文件不会自动出现在这里。</p></div>
      <article class="hero-feature" id="heroFeature" hidden></article>
    </section>
    <section id="featured" aria-labelledby="featuredTitle" hidden>
      <header class="section-head"><div><h2 id="featuredTitle">本周精选</h2><p>由公开作品中挑选，不代表所有公开文件都会进入首页。</p></div></header>
      <div class="featured-rail" id="featuredRail"></div>
    </section>
    <section id="explore" aria-labelledby="exploreTitle">
      <header class="section-head"><div><h2 id="exploreTitle">作品</h2><p>按作品本身逛，也可以打开作品查看原始资源。</p></div></header>
      <div class="explore-tools"><button class="filter-chip is-active" type="button" data-type="all" aria-pressed="true">全部</button><button class="filter-chip" type="button" data-type="image" aria-pressed="false">图片</button><button class="filter-chip" type="button" data-type="video" aria-pressed="false">视频</button><label class="search-control"><span class="sr-only">搜索作品或创作者</span><input id="searchInput" type="search" placeholder="搜索作品或创作者"></label></div>
      <div id="feedStatus" class="feed-status" aria-live="polite"></div>
      <div id="masonry" class="masonry" aria-live="polite"></div>
      <div class="load-more-wrap"><button id="loadMore" class="text-button" type="button" hidden>加载更多</button></div>
    </section>
  </main>
  <footer class="public-footer">CloudFlare ImgBed · 公开内容由各自创作者维护</footer>
  <div id="dialogRoot"></div>
  <script type="module" src="/discover/discover.js"></script>
</body>
</html>
