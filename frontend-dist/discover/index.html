<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="发现由创作者公开分享的图片、动图与视频。">
  <link rel="icon" href="/static/media/logo.png">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('imgbed-theme')||((matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light')}catch{}</script>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/discover/discover.css">
  <link rel="stylesheet" href="/preview-style.css">
  <title>发现 · CloudFlare ImgBed</title>
</head>
<body>
  <a class="skip-link" href="#explore">跳到作品列表</a>
  <header class="public-nav">
    <a class="brand" href="/" aria-label="CloudFlare ImgBed 首页"><span class="brand-mark" aria-hidden="true">I</span><span>ImgBed <small>Community</small></span></a>
    <nav class="public-links" aria-label="公共导航"><a href="/">首页</a><a class="is-active" href="#explore">Discover</a><a href="/charinfo/">CharInfo Creator</a></nav>
    <div class="nav-actions">
      <a class="text-button" data-account-action href="/api/auth/discord?returnTo=/">登录</a>
      <a class="primary-button" data-upload-action href="/api/auth/discord?returnTo=%2Faccount%2F%3Fview%3Dfiles%26upload%3D1">上传</a>
      <button class="theme-button" type="button" data-theme-toggle aria-label="切换主题"><svg class="theme-toggle-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="theme-sun"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></g><g class="theme-moon"><path d="M20 15.2A8.3 8.3 0 0 1 8.8 4 8.4 8.4 0 1 0 20 15.2Z"/></g></svg></button>
    </div>
  </header>

  <main class="discover-wrap">
    <section id="featured" class="featured-section" aria-labelledby="featuredTitle" hidden>
      <header class="section-intro"><div><h1 id="featuredTitle">精选推荐</h1></div></header>
      <div class="featured-showcase">
        <article class="hero-feature" id="heroFeature" hidden></article>
        <div class="featured-rail" id="featuredRail"></div>
      </div>
    </section>

    <section id="albumDiscover" class="album-discover" aria-labelledby="albumDiscoverTitle" hidden>
      <header class="section-intro"><div><h2 id="albumDiscoverTitle">公开图库</h2></div></header>
      <div id="albumGrid" class="album-grid" aria-live="polite"></div>
    </section>

    <section id="explore" class="explore-section" aria-labelledby="exploreTitle">
      <header class="section-intro explore-heading"><div><h2 id="exploreTitle">发现</h2></div></header>
      <div class="explore-tools">
        <div class="filter-group" aria-label="作品类型"><button class="filter-chip is-active" type="button" data-type="all" aria-pressed="true">全部</button><button class="filter-chip" type="button" data-type="image" aria-pressed="false">图片</button><button class="filter-chip" type="button" data-type="video" aria-pressed="false">视频</button></div>
        <label class="search-control"><span class="sr-only">搜索作品或创作者</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.2 4.2"/></svg><input id="searchInput" type="search" placeholder="搜索作品或创作者"></label>
      </div>
      <div id="feedStatus" class="feed-status" aria-live="polite"></div>
      <div id="masonry" class="masonry" aria-live="polite"></div>
      <div id="feedSentinel" class="feed-sentinel" aria-hidden="true"></div>
      <div class="load-more-wrap"><button id="loadMore" class="text-button" type="button" hidden>加载更多</button></div>
    </section>
  </main>

  <footer class="public-footer"><span>CloudFlare ImgBed</span><span>公开内容由各自创作者维护</span></footer>
  <div id="dialogRoot"></div>
  <script type="module" src="/theme.js"></script>
  <script type="module" src="/discover/discover.js"></script>
</body>
</html>
