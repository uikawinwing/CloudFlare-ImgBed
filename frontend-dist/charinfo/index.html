<!doctype html>
<html lang="zh-CN" data-site-page-title="角色编辑已移至 ST">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="角色资料请在 SillyTavern 的 CharInfo Manager 中编辑。本站继续提供文件与图库管理。">
  <link rel="icon" href="/static/media/logo.png">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('imgbed-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{}</script>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/discover/discover.css">
  <link rel="stylesheet" href="/charinfo/retired.css">
  <title>角色编辑已移至 ST · Charatopia</title>
</head>
<body>
  <header class="public-nav">
    <a class="brand" href="/" data-site-link aria-label="Charatopia 首页"><span class="site-brand-symbol" data-site-logo aria-hidden="true"><span class="site-wordmark" data-site-logo-fallback></span></span><span data-site-name data-site-brand-text hidden>Charatopia</span></a>
    <nav class="public-links" aria-label="公共导航"><a href="/">首页</a><a href="/discover/">Discover</a><a href="/account/?view=albums">我的图库</a></nav>
  </header>
  <main class="retirement">
    <h1>角色编辑已移至 ST</h1>
    <p>请在 SillyTavern 的 CharInfo Manager 中编辑并保存角色资料。本站继续管理图片、视频和图库；连接图库只更新 ST 中的远程图库链接。</p>
    <a class="primary-button" href="/account/?view=albums">管理我的图库</a>
    <section class="draft-recovery" aria-labelledby="draftTitle">
      <h2 id="draftTitle">保留旧浏览器草稿</h2>
      <p>旧草稿仍保存在原浏览器和本站原域名下。可以下载完整 JSON 备份，保留原稿及未完成内容。此备份不能直接导入 ST，请参考其中的资料，在 CharInfo Manager 中手动迁移。</p>
      <p>下载不会删除草稿，也不会上传到服务器。请勿在取得备份前清除浏览器数据。</p>
      <button class="text-button" type="button" id="downloadLegacyDraft">下载旧草稿备份</button>
      <p class="draft-status" id="draftStatus" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="/site.js"></script>
  <script type="module" src="/theme.js"></script>
  <script type="module">import { mountDraftExport } from '/charinfo/retired.js'; mountDraftExport();</script>
</body>
</html>
