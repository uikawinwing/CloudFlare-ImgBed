<!doctype html>
<html lang="zh-CN" data-site-page-title="登录">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="使用 Discord 登录 Charatopia">
  <link rel="icon" href="/brand/charatopia-wordmark.svg">
  <title>登录 · Charatopia</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('imgbed-theme')||((matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light')}catch{}</script>
  <link rel="stylesheet" href="/theme.css">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{display:grid;grid-template-rows:auto 1fr auto;min-height:100dvh;background:var(--app-bg);color:var(--app-text)}
    .login-header{display:flex;align-items:center;min-height:76px;padding:16px clamp(20px,5vw,66px);border-bottom:1px solid var(--app-border)}
    .login-brand{display:inline-flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
    .login-brand .site-brand-symbol{width:170px}
    .login-brand .site-brand-symbol[data-custom-logo=true]{width:40px;height:40px}
    .login-brand-text{font-size:20px;font-weight:700}
    .login-main{display:grid;place-items:center;padding:32px 20px}
    .login-card{width:min(100%,440px);padding:clamp(24px,5vw,44px);border:1px solid var(--app-border-strong);border-radius:18px;background:var(--app-surface);text-align:center}
    .login-card h1{margin:0 0 10px;font-size:27px;letter-spacing:-.02em}
    .login-card p{margin:0 0 24px;line-height:1.7;color:var(--app-muted-strong)}
    .login-button{display:block;padding:13px 18px;background:#5865f2;border-radius:9px;color:#fff;text-decoration:none;font-weight:700;transition:background .15s}
    .login-button:hover,.login-button:focus-visible{background:#4752c4}
    .login-note{min-height:22px;margin:14px 0 0;color:var(--app-muted);font-size:12px;line-height:1.6}
    .login-back{display:inline-block;margin-top:24px;color:var(--app-muted-strong);font-size:13px;text-decoration:underline;text-underline-offset:3px}
    .login-footer{padding:20px;color:var(--app-muted);text-align:center;font-size:12px}
    @media(max-width:480px){.login-header{min-height:64px}.login-card{border-radius:14px}}
  </style>
</head>
<body>
  <header class="login-header">
    <a class="login-brand" href="/" data-site-link aria-label="Charatopia 首页">
      <span class="site-brand-symbol" data-site-logo><span class="site-wordmark" data-site-logo-fallback>Charatopia</span></span>
      <span class="login-brand-text" data-site-name data-site-brand-text hidden>Charatopia</span>
    </a>
  </header>
  <main class="login-main">
    <section class="login-card" aria-labelledby="login-heading">
      <h1 id="login-heading">登录后继续</h1>
      <p>使用 Discord 验证身份，登录后返回原来的工作区。</p>
      <a id="discordLogin" class="login-button" href="/api/auth/discord">使用 Discord 登录</a>
      <div id="loginStatus" class="login-note" role="status" aria-live="polite">正在检查登录状态…</div>
      <a class="login-back" href="/">返回首页</a>
    </section>
  </main>
  <footer class="login-footer"><span data-site-name>Charatopia</span></footer>
  <script type="module" src="/site.js"></script>
  <script type="module" src="/login/login.js"></script>
</body>
</html>
